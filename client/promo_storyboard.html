<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Storyboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Press Start 2P', cursive;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            items-align: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-align: center;
            color: white;
        }

        .slide.active {
            opacity: 1;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            z-index: -1;
            filter: brightness(0.6);
        }

        h1 {
            font-size: 3rem;
            text-shadow: 4px 4px 0 #000;
            z-index: 10;
            margin: 0;
            padding: 20px;
        }

        .highlight {
            color: #facc15;
        }
    </style>
</head>

<body>
    <!-- Scene 1: Lonely Coder -->
    <div class="slide" id="slide1">
        <img src="src/assets/lonely_coder.png" alt="Lonely Coder">
        <h1>Coding in the <span class="highlight">Dark?</span></h1>
    </div>

    <!-- Scene 2: Empty Launch -->
    <div class="slide" id="slide2">
        <img src="src/assets/empty_launch.png" alt="Empty Launch">
        <h1>Launching into the <span class="highlight">Void?</span></h1>
    </div>

    <!-- Scene 3: Solution (Meet Builders) -->
    <div class="slide" id="slide3">
        <img src="src/assets/meet_builders.png" alt="Meet Builders" style="filter: brightness(0.8)">
        <h1>Join the <span class="highlight">World.</span></h1>
    </div>

    <!-- Scene 4: Action (Game Live) -->
    <div class="slide" id="slide4">
        <iframe src="http://localhost:5173/game" style="width: 100%; height: 100%; border: none;"></iframe>
        <h1 style="position: absolute; bottom: 20px; width: 100%; pointer-events: none;">Build <span
                class="highlight">Public.</span><br>Grow <span class="highlight">Together.</span></h1>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Start Sequence
        setTimeout(() => {
            slides[0].classList.add('active'); // Start Slide 1
            setTimeout(nextSlide, 6000); // Slide 2 at 6s
            setTimeout(nextSlide, 12000); // Slide 3 at 12s
            setTimeout(nextSlide, 18000); // Slide 4 (Game) at 18s
            // Slide 4 stays for 6s+
        }, 500);
    </script>
</body>

</html>
